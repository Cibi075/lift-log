  if (f === 'name' || f === 'focus') { if (t.value.trim()) day[f] = t.value.trim(); save(); $('#title').textContent = 'Edit ' + day.name; return; }
  const item = day.items[Number(t.closest('[data-i]').dataset.i)];
  if (f === 'rir' || f === 'cue') { item[PE_FIELDS[f]] = t.value.trim(); save(); return; }
  const n = parseInt(t.value, 10);
  if (n >= 1 && n <= 100) { item[PE_FIELDS[f]] = n; save(); }
});
$('#view').addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.pe || ui.planEdit == null || !['sets', 'lo', 'hi'].includes(t.dataset.pe)) return;
  const item = editablePlanDay(ui.planEdit).items[Number(t.closest('[data-i]').dataset.i)];
  item[1] = Math.max(1, Math.min(10, item[1]));
  if (item[2] > item[3]) { if (t.dataset.pe === 'lo') item[3] = item[2]; else item[2] = item[3]; }
  save(); render();
});

/* Remember an open Exercises list across redraws while you edit it. */
$('#view').addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('ex-fold')) ui.exOpen = e.target.open; }, true);

$('#view').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'progSel') { ui.progEx = t.value; saveUi(); render(); }
  else if (t.id === 'restSel') { S.settings.rest = Number(t.value); save(); toast('Rest timer ' + (S.settings.rest ? fmtClock(S.settings.rest) : 'off')); }
  else if (t.dataset.act === 'date') render();
  else if (t.dataset.act === 'exGroup') {
    const ex = S.exercises.find(x => x.id === t.closest('[data-ex]').dataset.ex);
    const warn = ex && groupMismatch(ex.name, t.value);
    if (warn && !confirm(warn)) { t.value = ex.group; return; }
    if (ex) { ex.group = t.value; save(); render(); toast(`${ex.name} moved to ${ex.group}`); }
  }
});

$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const w = currentW();
  const itemEl = b.closest('[data-item]');
  const it = itemEl && w ? w.items.find(i => i.id === itemEl.dataset.item) : null;
  const setEl = b.closest('[data-set]');
  const s = setEl && it ? it.sets.find(x => x.id === setEl.dataset.set) : null;

  switch (act) {
    case 'start': newWorkout([]); break;
    case 'repeat': {
      const src = getW(b.dataset.id); if (!src) break;
      newWorkout(src.items.map(i => ({ id: uid(), exId: i.exId, sets: (i.sets.length ? i.sets : [0]).map(() => ({ id: uid(), w: '', r: '', done: false })) })));
      break;
    }
    case 'openActive': go('workout'); break;
    case 'open': ui.editId = b.dataset.id; render(); scrollTo(0, 0); break;
    case 'logPast': {
      const nw = { id: uid(), date: today(), start: Date.now(), end: null, note: '', items: [] };
      S.workouts.push(nw); save(); ui.editId = nw.id; render(); scrollTo(0, 0);
      toast('Set the date at the top');
      break;
    }
    case 'addEx':
      pickExercise(id => {
        const ni = { id: uid(), exId: id, sets: [{ id: uid(), w: '', r: '', done: false }] };
        w.items.push(ni); save(); render(); scrollToItem(ni.id);
      });
      break;
    case 'addSet': {
      const last = it.sets[it.sets.length - 1];
      it.sets.push({ id: uid(), w: last ? last.w : '', r: last ? last.r : '', done: false });
      save(); render();
      break;
    }
    case 'delSet':
      it.sets = it.sets.filter(x => x !== s); save(); render();
      break;
    case 'toggleSet':
      if (!s.done) {
        const [wi, ri] = setEl.querySelectorAll('input');
        if (!String(s.w).trim() && wi.placeholder) s.w = wi.placeholder;
        if (!String(s.r).trim() && ri.placeholder) s.r = ri.placeholder;
        s.done = true;
        if (w.id === S.activeId) { s.t = Date.now(); startRest(); }
      } else { s.done = false; delete s.t; }
      save(); render();
      break;
    case 'itemMenu': {
      const idx = w.items.indexOf(it);
      openSheet(`<h2>${esc(exName(it.exId))}</h2>
        ${idx > 0 ? '<button class="list-item" data-s="up">Move up</button>' : ''}
        ${idx < w.items.length - 1 ? '<button class="list-item" data-s="down">Move down</button>' : ''}
        <button class="list-item" data-s="swap">Replace with another exercise</button>
        <button class="list-item" data-s="prog">View progress</button>
        <button class="list-item danger" data-s="remove">Remove from workout</button>`, a => {
        const i = w.items.indexOf(it);
        if (a === 'up' && i > 0) { w.items.splice(i, 1); w.items.splice(i - 1, 0, it); }
        if (a === 'down' && i < w.items.length - 1) { w.items.splice(i, 1); w.items.splice(i + 1, 0, it); }
        if (a === 'swap') { pickExercise(id => { it.exId = id; save(); render(); }, 'Replace exercise'); return; }
        if (a === 'prog') { ui.progEx = it.exId; go('progress'); return; }
        if (a === 'remove') {
          if (it.sets.some(hasData) && !confirm('Remove this exercise and its sets?')) return;
          w.items = w.items.filter(x => x !== it);
        }
        save(); closeSheet(); render();
        if (a === 'up' || a === 'down') scrollToItem(it.id);
      });
      break;
    }
    case 'finish': {
      for (const x of w.items) x.sets = x.sets.filter(st => st.done || hasData(st));
      w.items = w.items.filter(x => x.sets.length);
      if (!w.items.length) {
        if (!confirm('Nothing was logged. Discard this workout?')) { render(); break; }
        S.workouts = S.workouts.filter(x => x !== w);
      } else w.end = Date.now();
      S.activeId = null; S.restEnd = null; save();
      render(); scrollTo(0, 0);
      if (!w.items.length) { toast('Workout discarded'); break; }
      openSheet(`<h2>How hard was it?</h2>
        <button class="list-item" data-s="1"><b>Easy</b><div class="muted small">Could have done many more reps</div></button>
        <button class="list-item" data-s="2"><b>Solid</b><div class="muted small">About 2 to 3 reps left on most sets</div></button>
        <button class="list-item" data-s="3"><b>Very hard</b><div class="muted small">At or near failure on most sets</div></button>
        <button class="list-item muted" data-s="0">Skip</button>`, a => {
        if (a !== '0') { w.feel = Number(a); save(); }
        closeSheet(); render(); toast('Workout saved');
      });
      break;
    }
    case 'delWorkout':
      if (!confirm(w.id === S.activeId ? 'Discard this workout?' : 'Delete this workout permanently?')) break;
      S.workouts = S.workouts.filter(x => x !== w);
      if (S.activeId === w.id) { S.activeId = null; S.restEnd = null; }
      ui.editId = null; save(); toast('Deleted'); render(); scrollTo(0, 0);
      break;
    case 'metric': ui.metric = b.dataset.m; saveUi(); render(); break;
    case 'unit': {
      const to = b.dataset.u, from = unit();
      if (to === from) break;
      const hasWeights = S.workouts.some(x => x.items.some(i => i.sets.some(st => num(st.w) > 0)));
      if (hasWeights && confirm(`Convert all logged weights from ${from} to ${to}?\n\nOK converts the numbers. Cancel only changes the label.`)) {
        const f = to === 'lb' ? 2.20462 : 1 / 2.20462;
        for (const x of S.workouts) for (const i of x.items) for (const st of i.sets) {
          const n = num(st.w); if (n != null) st.w = fmtNum(Math.round(n * f * 10) / 10);
        }
        for (const bd of S.body) { const n = num(bd.bw); if (n != null) bd.bw = fmtNum(Math.round(n * f * 10) / 10); }
      }
      S.settings.unit = to; save(); render();
      break;
    }
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'startPlan': {
      const items = planSession(Number(b.dataset.d), analyze());
      save(); newWorkout(items); toast(planDay(Number(b.dataset.d)).name + ' loaded');
      break;
    }
    case 'pickPlanDay':
      openSheet('<h2>Which session?</h2>' + [1, 2, 3, 4, 5, 6].map(d => `<button class="list-item" data-s="${d}"><b>${DAY_NAMES[d]} · ${esc(planDay(d).name)}</b><div class="muted small">${esc(planDay(d).focus)}</div></button>`).join(''), a => {
        const d = Number(a); closeSheet();
        const items = planSession(d, analyze()); save(); newWorkout(items); toast(planDay(d).name + ' loaded');
      });
      break;
    case 'editPlan': ui.planEdit = Number(b.dataset.d); render(); scrollTo(0, 0); break;
    case 'peUp': case 'peDown': {
      const day = editablePlanDay(ui.planEdit), i = Number(b.closest('[data-i]').dataset.i), j = act === 'peUp' ? i - 1 : i + 1;
      if (j >= 0 && j < day.items.length) { [day.items[i], day.items[j]] = [day.items[j], day.items[i]]; save(); render(); }
      break;
    }
    case 'peDel': {
      const day = editablePlanDay(ui.planEdit), i = Number(b.closest('[data-i]').dataset.i);
      if (!confirm(`Remove ${day.items[i][0]} from ${day.name}?`)) break;
      day.items.splice(i, 1); save(); render();
      break;
    }
    case 'peAdd': {
      const d = ui.planEdit;
      pickExercise(id => { editablePlanDay(d).items.push([exName(id), 3, 8, 12, '1-2', '']); save(); render(); }, 'Add to ' + planDay(d).name);
      break;
    }
    case 'peReset':
      if (!confirm(`Reset ${planDay(ui.planEdit).name} to the original plan?`)) break;
      delete S.plan.days[ui.planEdit]; save(); render(); toast('Session reset');
      break;
    case 'planToggle':
      S.plan = Object.assign(S.plan || { start: planStartDefault() }, { on: b.dataset.on === '1' });
      save(); render(); toast(planOn() ? 'Plan on' : 'Plan off');
      break;
    case 'planRestart':
      if (!confirm('Restart the plan at week 1 this week?')) break;
      S.plan.start = weekStart(today()); save(); render(); toast('Plan restarted');
      break;
    case 'startSuggested': {
      const items = planWorkout(b.dataset.g.split(','), analyze());
      newWorkout(items);
      toast(items.length ? 'Workout loaded with your targets' : 'Add your exercises');
      break;
    }
    case 'insGroup': ui.insGroup = b.dataset.g; saveUi(); render(); break;
    case 'region': ui.region = ui.region === b.dataset.r ? null : b.dataset.r; render(); break;
    case 'logBody': openBodySheet(); break;
    case 'saveBw': {
      const v = num($('#bwIn').value);
      if (!(v > 0)) { alert('Enter your bodyweight.'); break; }
      saveBody(today(), { bw: v }); render(); toast('Weigh-in saved');
      break;
    }
    case 'pasteHealth':
      (async () => {
        let text = '', blocked = false;
        try { text = await navigator.clipboard.readText(); } catch (err) { blocked = true; }
        const why = blocked ? 'Lift Log could not read the clipboard. Tap Paste when your iPhone asks, or paste the text below.' : healthProblem(text);
        if (why) syncHelp(why); else importHealth(text);
      })();
      break;
    case 'saveCheckin': {
      const e = {};
      for (const [k, key, lo, hi] of [['rcScore', 'score', 0, 100], ['rcSleep', 'sleepScore', 0, 100], ['rcHrv', 'hrv', 5, 300], ['rcHr', 'hr', 25, 220], ['rcMove', 'move', 0, 100]]) {
        const v = num($('#' + k).value); e[key] = v != null && v >= lo && v <= hi ? v : null;
      }
      if (Object.values(e).every(v => v == null)) { alert('Enter at least one number.'); break; }
      S.recovery = S.recovery.filter(r => r.date !== today());
      S.recovery.push(Object.assign({ date: today(), synced: Date.now(), via: 'manual' }, e));
      save(); render(); toast('Check-in saved');
      break;
    }
    case 'setGoal': {
      const k = b.dataset.g;
      if (S.goal && S.goal.type === k) S.goal.asked = today();
      else {
        S.goal = { type: k, date: today(), asked: today() };
        S.goalHistory.push({ type: k, date: today() });
      }
      save(); render(); toast('Goal: ' + GOALS[k].label);
      break;
    }
    case 'skipCheckin': S.checkinSkip = today(); save(); render(); break;
    case 'snoozeBw': S.weighSnooze = Date.now() + 3 * 864e5; save(); render(); break;
    case 'delBody':
      if (!confirm('Delete this entry?')) break;
      S.body = S.body.filter(x => x.id !== b.dataset.id); save(); render();
      break;
    case 'newEx': {
      const name = (prompt('New exercise name') || '').trim();
      if (!name) break;
      if (S.exercises.some(x => x.name.toLowerCase() === name.toLowerCase())) { alert('That exercise already exists.'); break; }
      askGroup(name, () => render());
      break;
    }
    case 'exMenu': {
      const ex = S.exercises.find(x => x.id === b.closest('[data-ex]').dataset.ex);
      openSheet(`<h2>${esc(ex.name)}</h2>
        <button class="list-item" data-s="rename">Rename</button>
        <button class="list-item danger" data-s="delete">Delete</button>`, a => {
        closeSheet();
        if (a === 'rename') {
          const name = (prompt('Rename exercise', ex.name) || '').trim();
          if (name && name !== ex.name) { ex.name = name; save(); render(); }
        }
        if (a === 'delete') {
          const used = S.workouts.filter(x => x.items.some(i => i.exId === ex.id)).length;
          if (used) { alert(`This exercise is used in ${used} workout${used === 1 ? '' : 's'}, so it can't be deleted. You can rename it instead.`); return; }
          if (!confirm(`Delete "${ex.name}"?`)) return;
          S.exercises = S.exercises.filter(x => x !== ex); save(); render();
        }
      });
      break;
    }
    case 'wipe':
      if (!confirm('Erase ALL workouts and exercises from this phone?')) break;
      if (!confirm('Really erase everything? This cannot be undone. Export a backup first if you might want it.')) break;
      S = blankState(); save(); go('workout');
      break;
  }
});

/* Ring shortcut text: "liftlog:date=2026-10-11&recovery=78&sleep=84&hrv=52 ms&hr=58 bpm&move=71".
   Each value may be a bare number or a short sentence; values outside sensible ranges are dropped. */
const RING_FIELDS = [
  /* text key, stored key, lowest, highest, unit that may follow the number, label */
  ['recovery', 'score', 0, 100, '', 'recovery'],
  ['sleep', 'sleepScore', 0, 100, '', 'sleep'],
  ['hrv', 'hrv', 5, 300, 'ms', 'HRV'],
  ['hr', 'hr', 25, 220, 'bpm', 'HR'],
  ['move', 'move', 0, 100, '', 'movement']
];
/* The reading in "52", "52 ms" or "Your HRV is 52 ms": the number with the unit, else the last number in range. */
function ringNumber(v, lo, hi, unitWord) {
  if (v == null || v === '') return null;
  const t = String(v).replace(/\s*(?:\/|out of)\s*100\b/gi, '');
  const all = [...t.matchAll(/(\d+(?:[.,]\d+)?)\s*([a-z%]*)/gi)]
    .map(x => ({ n: num(x[1]), u: x[2].toLowerCase() }))
    .filter(x => x.n != null && x.n >= lo && x.n <= hi);
  if (!all.length) return null;
  const withUnit = unitWord ? all.find(x => x.u.startsWith(unitWord)) : null;
  return Math.round((withUnit || all[all.length - 1]).n);
}
function parseHealthText(text) {
  const m = String(text || '').replace(/[\r\n]+/g, ' ').trim().match(/liftlog:(.+)$/i);
  if (!m) return null;
  const q = new URLSearchParams(m[1].replace(/\+/g, '%2B'));
  const e = {};
  for (const [k, key, lo, hi, u] of RING_FIELDS) e[key] = ringNumber(q.get(k), lo, hi, u);
  const d = (q.get('date') || '').trim(), parsed = d && !/^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d) : null;
  return { date: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : parsed && !isNaN(parsed) ? isoDate(parsed) : today(), e };
}
/* Why a piece of text can't be synced, in plain words; empty when it can. */
function healthProblem(text) {
  const t = String(text || '').trim(), cut = n => t.length > n ? t.slice(0, n) + '…' : t;
  if (!t) return 'The clipboard is empty. Run the Lift Log Health shortcut first, then tap Sync ring.';
  if (!/liftlog:/i.test(t)) return `The clipboard has other text: "${cut(60)}". The shortcut needs a Text action that starts with liftlog:date= followed by Copy to Clipboard.`;
  const p = parseHealthText(t);
  if (!p || Object.values(p.e).every(v => v == null)) return `Found the Lift Log text but no numbers: "${cut(90)}". In the Text action, put each ring result right after its label (recovery=, sleep=, hrv=, hr=, move=).`;
  if (p.date !== today()) return `This text is from ${fmtShort(p.date)}. Run the shortcut again today.`;
  return '';
}
function importHealth(text) {
  const why = healthProblem(text);
  if (why) { toast('Sync failed'); return false; }
  const p = parseHealthText(text);
  let r = S.recovery.find(x => x.date === p.date);
  if (!r) { r = { date: p.date }; S.recovery.push(r); }
  for (const k in p.e) if (p.e[k] != null) r[k] = p.e[k];
  r.synced = Date.now(); r.via = 'ring';
  save(); render();
  toast('Imported · ' + RING_FIELDS.filter(f => p.e[f[1]] != null).map(f => `${f[5]} ${p.e[f[1]]}`).join(' · '));
  return true;
}
/* Also accepts the text in the link (#liftlog:...). The part after # never leaves the phone. */
function importFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!/^liftlog:/i.test(h)) return;
  history.replaceState(null, '', location.pathname + location.search);
  const why = healthProblem(h);
  if (why) syncHelp(why); else importHealth(h);
}
/* Shown when a sync fails: the reason, plus a box to paste the shortcut text by hand. */
function syncHelp(why) {
  openSheet(`<h2>Sync did not work</h2><p class="muted small" id="syncWhy">${esc(why)}</p>
    <textarea id="pasteBox" rows="3" placeholder="Or paste the shortcut text here"></textarea>
    <button class="btn primary block mt" data-s="import">Import</button>`, a => {
    if (a !== 'import') return;
    const t = $('#pasteBox').value, w = healthProblem(t);
    if (w) { $('#syncWhy').textContent = w; return; }
    closeSheet(); importHealth(t);
  });
}

if (!S.plan) { S.plan = { on: true, start: planStartDefault() }; save(); }
render();
importFromHash();
addEventListener('hashchange', importFromHash);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
